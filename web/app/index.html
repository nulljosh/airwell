<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Breathe. Airwell</title>
<meta name="description" content="Follow the circle. Box, 4-7-8, Relax, Coherent or your own counts.">
<link rel="canonical" href="https://airwell.jaybulb.com/app/">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/landing.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); }
  .app-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; }
  .app-bar a { display: inline-flex; align-items: center; gap: 8px; color: var(--text); text-decoration: none; font-weight: 600; }
  .app-bar .back { font-weight: 400; color: var(--sub); }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(16px, 5vw, 64px) 16px; }
</style>
</head>
<body>
<nav class="app-bar" aria-label="App">
  <a href="/" aria-label="Airwell home"><img src="/icon.svg" alt="" width="28" height="28"><span>Airwell</span></a>
  <a class="back" href="https://apps.apple.com/app/id6810806058">Get the app</a>
</nav>
<main class="stage">
  <div class="art stage-art" style="--img: url(/art/monet.png)" aria-hidden="true"></div>
      <div class="tool" id="tool">
        <div class="presets" id="presets">
          <button data-pattern="4,4,4,4" class="active">Box</button>
          <button data-pattern="4,7,8,0">4-7-8</button>
          <button data-pattern="4,0,6,0">Relax</button>
          <button data-pattern="5,0,5,0">Coherent</button>
        </div>
        <div class="breath">
          <div class="ring"></div>
          <div class="circle" id="circle"><span id="label">Breathe</span></div>
        </div>
        <div class="reps" id="reps">Rep <span id="repCount">0</span></div>
        <div class="controls">
          <button class="start" id="toggle">Start</button>
          <button class="ghost" id="soundToggle" aria-pressed="false">Sound off</button>
        </div>
        <details class="custom">
          <summary>Custom pattern</summary>
          <div class="custom-row">
            <label>In <input type="number" id="cIn" min="0" max="30" value="4"></label>
            <label>Hold <input type="number" id="cHold1" min="0" max="30" value="4"></label>
            <label>Out <input type="number" id="cOut" min="0" max="30" value="4"></label>
            <label>Hold <input type="number" id="cHold2" min="0" max="30" value="4"></label>
            <button id="applyCustom">Use</button>
          </div>
        </details>
      </div>
</main>
<script>
  const circle = document.getElementById('circle');
  const label = document.getElementById('label');
  const toggleBtn = document.getElementById('toggle');
  const soundBtn = document.getElementById('soundToggle');
  const repCount = document.getElementById('repCount');
  const presetButtons = document.querySelectorAll('#presets button');

  let pattern = [4,4,4,4]; // inhale, hold, exhale, hold (seconds)
  let running = false;
  let timer = null;
  let phaseIdx = 0;
  let reps = 0;
  let soundOn = false;
  let audioCtx = null;
  const phaseNames = ['Inhale','Hold','Exhale','Hold'];
  const phaseScale = [1.4, 1.4, 0.8, 0.8];

  function chime(){
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 440;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}
  }

  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn);
    soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    try { localStorage.setItem('breathe-sound', soundOn ? '1' : '0'); } catch(e) {}
  });
  try { soundOn = localStorage.getItem('breathe-sound') === '1'; } catch(e) {}
  soundBtn.setAttribute('aria-pressed', soundOn);
  soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';

  function setPreset(str, save){
    pattern = str.split(',').map(Number);
    if (save !== false) { try { localStorage.setItem('breathe-preset', str); } catch(e) {} }
    if (running) runPhase(0);
  }

  presetButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      presetButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      setPreset(btn.dataset.pattern);
    });
  });

  document.getElementById('applyCustom').addEventListener('click', ()=>{
    const vals = ['cIn','cHold1','cOut','cHold2'].map(id=>Math.min(30, Math.max(0, Math.round(Number(document.getElementById(id).value)||0))));
    if (vals.every(v=>v===0)) return; // an all-zero pattern would recurse forever
    presetButtons.forEach(b=>b.classList.remove('active'));
    setPreset(vals.join(','));
  });

  // restore last-used preset
  try {
    const saved = localStorage.getItem('breathe-preset');
    if (saved){
      const n = saved.split(',').map(Number);
      if (n.length === 4 && n.every(x=>x>=0) && n.some(x=>x>0)) pattern = n;
      const match = [...presetButtons].find(b=>b.dataset.pattern === saved);
      if (match){ presetButtons.forEach(b=>b.classList.remove('active')); match.classList.add('active'); }
    }
  } catch(e) {}

  // Recursive setTimeout state machine: i counts forever (not mod 4) so a
  // full cycle back to phase 0 is detectable to bump the rep counter, and a
  // 0-second phase (custom pattern) recurses straight through without
  // scheduling a timer or playing a chime for it.
  function runPhase(i){
    clearTimeout(timer);
    if (i % 4 === 0 && i !== 0) { reps++; repCount.textContent = reps; }
    phaseIdx = i % 4;
    const dur = pattern[phaseIdx];
    if (dur === 0){ runPhase(phaseIdx+1); return; }
    label.textContent = phaseNames[phaseIdx];
    chime();
    circle.style.transitionDuration = dur + 's';
    circle.style.transform = `translate(-50%,-50%) scale(${phaseScale[phaseIdx]})`;
    timer = setTimeout(()=>runPhase(i+1), dur*1000);
  }

  function start(){
    if (running) return;
    running = true;
    toggleBtn.textContent = 'Stop';
    reps = 0; repCount.textContent = 0;
    runPhase(0);
  }
  function stop(){
    if (!running) return;
    running = false;
    toggleBtn.textContent = 'Start';
    clearTimeout(timer);
    circle.style.transitionDuration = '1s';
    circle.style.transform = 'translate(-50%,-50%) scale(1)';
    label.textContent = 'Breathe';
  }

  toggleBtn.addEventListener('click', ()=> running ? stop() : start());

  document.addEventListener('keydown', (e)=>{
    if (e.code === 'Space' && e.target === document.body){
      e.preventDefault();
      running ? stop() : start();
    }
  });

</script>
</body>
</html>
