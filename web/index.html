<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breathe</title>
<style>
  :root{
    --bg:#0b1420; --bg2:#0e1a29; --fg:#eef3f8; --dim:#8fa2b8;
    --accent:#5b8def; --circle:#1a2c44; --ring: rgba(91,141,239,.35);
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f7fb; --bg2:#eaf0f8; --fg:#16202c; --dim:#5c6b7d; --accent:#3f6fd8; --circle:#dbe6f7; --ring: rgba(63,111,216,.25); }
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center}
  header{width:100%;max-width:960px;padding:28px 24px 0;display:flex;justify-content:space-between;align-items:center}
  .brand{font-weight:600;letter-spacing:.02em;font-size:17px}
  nav a{color:var(--dim);text-decoration:none;font-size:14px;margin-left:20px}

  main{width:100%;max-width:680px;padding:40px 24px 80px;text-align:center}
  h1{font-size:clamp(28px,5vw,42px);font-weight:600;margin:8px 0 6px;letter-spacing:-.01em}
  p.sub{color:var(--dim);font-size:16px;margin:0 0 40px}

  .presets{display:flex;gap:8px;justify-content:center;margin-bottom:36px;flex-wrap:wrap}
  .presets button{background:none;border:1px solid var(--circle);color:var(--dim);
    padding:8px 16px;border-radius:999px;font-size:14px;cursor:pointer;transition:.15s}
  .presets button.active{background:var(--accent);border-color:var(--accent);color:#fff}

  .stage{position:relative;width:min(70vw,320px);height:min(70vw,320px);margin:0 auto 32px}
  .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,var(--ring),transparent 70%)}
  .circle{position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:50%;
    background:var(--circle);transform:translate(-50%,-50%) scale(1);
    transition:transform 4s ease-in-out;display:flex;align-items:center;justify-content:center}
  .circle span{font-size:18px;font-weight:500;color:var(--fg);letter-spacing:.02em}

  .reps{color:var(--dim);font-size:13px;margin-bottom:16px}

  .controls{display:flex;gap:10px;justify-content:center;align-items:center}
  .start{background:var(--accent);color:#fff;border:none;padding:12px 32px;border-radius:999px;
    font-size:15px;font-weight:500;cursor:pointer}
  .start:active{opacity:.85}
  .ghost{background:none;border:1px solid var(--circle);color:var(--dim);padding:10px 18px;
    border-radius:999px;font-size:14px;cursor:pointer}
  .ghost[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}

  .custom{margin-top:28px;color:var(--dim);font-size:13px}
  .custom summary{cursor:pointer}
  .custom-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
  .custom-row label{display:flex;flex-direction:column;gap:4px;font-size:12px}
  .custom-row input{width:56px;padding:6px;border-radius:6px;border:1px solid var(--circle);
    background:none;color:var(--fg);font-size:13px}
  .custom-row button{align-self:flex-end;background:var(--accent);color:#fff;border:none;
    padding:7px 16px;border-radius:6px;font-size:13px;cursor:pointer}

  footer{color:var(--dim);font-size:13px;padding:24px;text-align:center}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
<link rel="stylesheet" href="devices.css">
<script>
// ponytail: UA sniff, good enough for a mockup. iphone is the default. ?embed = app only, for the landing demo frame.
(function(u,d){d=/Android/.test(u)?'android':/iPhone|iPad/.test(u)?'iphone':/Windows/.test(u)?'windows':/Mac/.test(u)?'mac':'iphone';document.documentElement.dataset.device=d;if(/[?&]embed\b/.test(location.search))document.documentElement.classList.add('embed')})(navigator.userAgent);
</script>
<style>
/* Live demo: the real app in a frame matching the visitor's device (nimble treatment) */
.demo{margin:2rem auto 0;text-align:center;position:relative;z-index:2}
.demo .device-screen{aspect-ratio:9/19.5}
.demo .device-mac .device-screen,.demo .device-windows .device-screen{aspect-ratio:16/10}
.demo .device-screen iframe{position:absolute;top:0;left:0;border:0;display:block;transform-origin:0 0;width:390px;height:845px;background:#fff}
.demo .device-mac .device-screen iframe,.demo .device-windows .device-screen iframe{width:1024px;height:640px}
.demo-caption{font-size:.9rem;opacity:.65;margin:1rem 0 0}
.embed .demo,.embed footer,.embed nav,.embed header,.embed h1,.embed .sub{display:none!important}
</style>
</head>
<body>

<header>
  <div class="brand">Breathe</div>
  <nav><a href="#tool">Try it</a></nav>
</header>

<main>
  <h1>A quiet minute for your breath</h1>
  <p class="sub">Guided breathing patterns. No account, no download, just breathe.</p>
<div class="demo">
  <div class="device device-iphone" id="demoFrame" data-title="Breathe"><div class="device-screen"><iframe id="demoApp" title="Breathe, live" loading="lazy" data-src="./?embed"></iframe></div></div>
  <p class="demo-caption">This is the <span id="demoDev">iPhone</span> app, live. Try it.</p>
</div>
<script>
(function(){var names={iphone:'iPhone',android:'Android',mac:'Mac',windows:'Windows'},dev=document.documentElement.dataset.device,f=document.getElementById('demoFrame'),i=document.getElementById('demoApp');
if(!names[dev])dev='iphone';f.className='device device-'+dev;document.getElementById('demoDev').textContent=names[dev];
if(!document.documentElement.classList.contains('embed'))i.src=i.dataset.src;
function fit(){i.style.transform='scale('+(i.parentNode.clientWidth/i.offsetWidth)+')';}fit();addEventListener('resize',fit);})();
</script>


  <div class="presets" id="presets">
    <button data-pattern="4,4,4,4" class="active">Box</button>
    <button data-pattern="4,7,8,0">4-7-8</button>
    <button data-pattern="4,0,6,0">Relax</button>
    <button data-pattern="5,0,5,0">Coherent</button>
  </div>

  <div class="stage" id="tool">
    <div class="ring"></div>
    <div class="circle" id="circle"><span id="label">Breathe</span></div>
  </div>

  <div class="reps" id="reps">Rep <span id="repCount">0</span></div>

  <div class="controls">
    <button class="start" id="toggle">Start</button>
    <button class="ghost" id="soundToggle" aria-pressed="false">Sound off</button>
  </div>

  <details class="custom">
    <summary>Custom pattern</summary>
    <div class="custom-row">
      <label>In <input type="number" id="cIn" min="0" max="30" value="4"></label>
      <label>Hold <input type="number" id="cHold1" min="0" max="30" value="4"></label>
      <label>Out <input type="number" id="cOut" min="0" max="30" value="4"></label>
      <label>Hold <input type="number" id="cHold2" min="0" max="30" value="4"></label>
      <button id="applyCustom">Use</button>
    </div>
  </details>
</main>

<footer>breathe.heyitsmejosh.com</footer>

<script>
  const circle = document.getElementById('circle');
  const label = document.getElementById('label');
  const toggleBtn = document.getElementById('toggle');
  const soundBtn = document.getElementById('soundToggle');
  const repCount = document.getElementById('repCount');
  const presetButtons = document.querySelectorAll('#presets button');

  let pattern = [4,4,4,4]; // inhale, hold, exhale, hold (seconds)
  let running = false;
  let timer = null;
  let phaseIdx = 0;
  let reps = 0;
  let soundOn = false;
  let audioCtx = null;
  const phaseNames = ['Inhale','Hold','Exhale','Hold'];
  const phaseScale = [1.4, 1.4, 0.8, 0.8];

  function chime(){
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 440;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}
  }

  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn);
    soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    try { localStorage.setItem('breathe-sound', soundOn ? '1' : '0'); } catch(e) {}
  });
  try { soundOn = localStorage.getItem('breathe-sound') === '1'; } catch(e) {}
  soundBtn.setAttribute('aria-pressed', soundOn);
  soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';

  function setPreset(str, save){
    pattern = str.split(',').map(Number);
    if (save !== false) { try { localStorage.setItem('breathe-preset', str); } catch(e) {} }
    if (running) runPhase(0);
  }

  presetButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      presetButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      setPreset(btn.dataset.pattern);
    });
  });

  document.getElementById('applyCustom').addEventListener('click', ()=>{
    const vals = ['cIn','cHold1','cOut','cHold2'].map(id=>Number(document.getElementById(id).value)||0);
    presetButtons.forEach(b=>b.classList.remove('active'));
    setPreset(vals.join(','));
  });

  // restore last-used preset
  try {
    const saved = localStorage.getItem('breathe-preset');
    if (saved){
      pattern = saved.split(',').map(Number);
      const match = [...presetButtons].find(b=>b.dataset.pattern === saved);
      if (match){ presetButtons.forEach(b=>b.classList.remove('active')); match.classList.add('active'); }
    }
  } catch(e) {}

  // Recursive setTimeout state machine: i counts forever (not mod 4) so a
  // full cycle back to phase 0 is detectable to bump the rep counter, and a
  // 0-second phase (custom pattern) recurses straight through without
  // scheduling a timer or playing a chime for it.
  function runPhase(i){
    if (i % 4 === 0 && i !== 0) { reps++; repCount.textContent = reps; }
    phaseIdx = i % 4;
    const dur = pattern[phaseIdx];
    if (dur === 0){ runPhase(phaseIdx+1); return; }
    label.textContent = phaseNames[phaseIdx];
    chime();
    circle.style.transitionDuration = dur + 's';
    circle.style.transform = `translate(-50%,-50%) scale(${phaseScale[phaseIdx]})`;
    timer = setTimeout(()=>runPhase(i+1), dur*1000);
  }

  function start(){
    if (running) return;
    running = true;
    toggleBtn.textContent = 'Stop';
    reps = 0; repCount.textContent = 0;
    runPhase(0);
  }
  function stop(){
    if (!running) return;
    running = false;
    toggleBtn.textContent = 'Start';
    clearTimeout(timer);
    circle.style.transitionDuration = '1s';
    circle.style.transform = 'translate(-50%,-50%) scale(1)';
    label.textContent = 'Breathe';
  }

  toggleBtn.addEventListener('click', ()=> running ? stop() : start());

  document.addEventListener('keydown', (e)=>{
    if (e.code === 'Space' && e.target === document.body){
      e.preventDefault();
      running ? stop() : start();
    }
  });
</script>

</body>
</html>
