<!doctype html>
<html lang="en">
<head>
<script>document.documentElement.classList.add('js');</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airwell</title>
<meta name="description" content="Four guided breathing patterns and a circle that expands and contracts on your behalf. No account, no download, no timer running out on you.">
<meta property="og:title" content="A quiet minute for your breath.">
<meta property="og:description" content="Four guided breathing patterns and a circle that expands and contracts on your behalf. No account, no download, no timer running out on you.">
<meta property="og:image" content="https://airwell.jaybulb.com/og.png">
<meta property="og:url" content="https://airwell.jaybulb.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://airwell.jaybulb.com/og.png">
<link rel="canonical" href="https://airwell.jaybulb.com/">
<link rel="stylesheet" href="tokens.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:var(--size-body)/24px var(--font);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased}
  header{width:100%;max-width:var(--measure);padding:var(--s5) var(--page) 0;display:flex;justify-content:space-between;align-items:center}
  .brand{font-size:var(--size-body);line-height:24px;font-weight:600}
  nav a{color:var(--accent);text-decoration:none;font-size:var(--size-subhead);line-height:20px}

  main{width:100%;max-width:var(--measure);padding:var(--s7) var(--page) var(--s7);text-align:center}
  h1{font-size:var(--size-large-title);line-height:41px;font-weight:700;letter-spacing:-.022em;margin:0 0 var(--s2)}
  p.sub{color:var(--text2);font-size:var(--size-body);line-height:24px;margin:0 0 var(--s6)}

  .presets{display:flex;gap:var(--s2);justify-content:center;margin-bottom:var(--s6);flex-wrap:wrap}
  .presets button{height:var(--control);padding:0 var(--s5);border:0;border-radius:var(--r-pill);
    background:var(--bg2);color:var(--text);font:inherit;font-size:var(--size-subhead);line-height:20px;cursor:pointer;
    transition:background .2s ease,color .2s ease}
  .presets button.active{background:var(--accent);color:#fff}

  @media (max-width:480px){.presets{display:grid;grid-template-columns:repeat(2,1fr);max-width:320px;margin-left:auto;margin-right:auto}.presets button{padding:0}}
  .stage{position:relative;width:min(70vw,320px);height:min(70vw,320px);margin:0 auto var(--s6)}
  .ring{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 24%,transparent),transparent 70%)}
  .circle{position:absolute;left:50%;top:50%;width:40%;height:40%;border-radius:50%;
    background:var(--bg2);box-shadow:inset 0 0 0 1px var(--border);transform:translate(-50%,-50%) scale(1);
    transition:transform 4s ease-in-out;display:flex;align-items:center;justify-content:center}
  .circle span{font-size:var(--size-body);line-height:24px;font-weight:600}

  .reps{color:var(--text2);font-size:var(--size-footnote);line-height:18px;margin-bottom:var(--s4)}

  .controls{display:flex;gap:var(--s2);justify-content:center;align-items:center}
  .start,.ghost{height:var(--control);border:0;border-radius:var(--r-pill);font:inherit;font-size:var(--size-subhead);line-height:20px;cursor:pointer;
    transition:opacity .2s ease,background .2s ease}
  .start{padding:0 var(--s6);background:var(--accent);color:#fff;font-weight:600}
  .start:active{opacity:.85}
  .ghost{padding:0 var(--s5);background:var(--bg2);color:var(--text)}
  .ghost[aria-pressed="true"]{color:var(--accent)}
  button:focus-visible,input:focus-visible,summary:focus-visible{outline:0;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent)}

  .custom{margin-top:var(--s6);color:var(--text2);font-size:var(--size-subhead);line-height:20px}
  .custom summary{cursor:pointer;border-radius:var(--r-pill);display:inline-block;padding:var(--s2) var(--s4)}
  .custom-row{display:flex;gap:var(--s3);flex-wrap:wrap;justify-content:center;align-items:flex-end;margin-top:var(--s4)}
  .custom-row label{display:flex;flex-direction:column;gap:var(--s1);font-size:var(--size-footnote);line-height:18px}
  .custom-row input{width:72px;height:var(--control);padding:0 var(--s4);border:0;border-radius:var(--r-pill);
    background:var(--bg2);color:var(--text);font:inherit;font-size:var(--size-subhead);text-align:center}
  .custom-row button{height:var(--control);padding:0 var(--s5);border:0;border-radius:var(--r-pill);background:var(--accent);color:#fff;
    font:inherit;font-size:var(--size-subhead);font-weight:600;cursor:pointer}

  footer{color:var(--text2);font-size:var(--size-footnote);line-height:18px;padding:var(--s5) var(--page) var(--s6);text-align:center}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }

  html.js .reveal{opacity:0;transform:translateY(var(--s4))}
  html.js .reveal.in-view{opacity:1;transform:translateY(0);transition:opacity .2s ease-out,transform .2s ease-out}
  @media (prefers-reduced-motion: reduce){ html.js .reveal{opacity:1;transform:none} }
</style>
</head>
<body>

<header>
  <div class="brand">Airwell</div>
  <nav><a href="#tool">Try it</a></nav>
</header>

<main>
  <h1>A quiet minute for your breath</h1>
  <p class="sub">Guided breathing patterns. No account, no download, just breathe.</p>

  <div class="presets reveal" id="presets">
    <button data-pattern="4,4,4,4" class="active">Box</button>
    <button data-pattern="4,7,8,0">4-7-8</button>
    <button data-pattern="4,0,6,0">Relax</button>
    <button data-pattern="5,0,5,0">Coherent</button>
  </div>

  <div class="stage" id="tool">
    <div class="ring"></div>
    <div class="circle" id="circle"><span id="label">Breathe</span></div>
  </div>

  <div class="reps" id="reps">Rep <span id="repCount">0</span></div>

  <div class="controls">
    <button class="start" id="toggle">Start</button>
    <button class="ghost" id="soundToggle" aria-pressed="false">Sound off</button>
  </div>

  <details class="custom reveal">
    <summary>Custom pattern</summary>
    <div class="custom-row">
      <label>In <input type="number" id="cIn" min="0" max="30" value="4"></label>
      <label>Hold <input type="number" id="cHold1" min="0" max="30" value="4"></label>
      <label>Out <input type="number" id="cOut" min="0" max="30" value="4"></label>
      <label>Hold <input type="number" id="cHold2" min="0" max="30" value="4"></label>
      <button id="applyCustom">Use</button>
    </div>
  </details>
</main>

<footer class="reveal">airwell.jaybulb.com</footer>

<script>
  const circle = document.getElementById('circle');
  const label = document.getElementById('label');
  const toggleBtn = document.getElementById('toggle');
  const soundBtn = document.getElementById('soundToggle');
  const repCount = document.getElementById('repCount');
  const presetButtons = document.querySelectorAll('#presets button');

  let pattern = [4,4,4,4]; // inhale, hold, exhale, hold (seconds)
  let running = false;
  let timer = null;
  let phaseIdx = 0;
  let reps = 0;
  let soundOn = false;
  let audioCtx = null;
  const phaseNames = ['Inhale','Hold','Exhale','Hold'];
  const phaseScale = [1.4, 1.4, 0.8, 0.8];

  function chime(){
    if (!soundOn) return;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = 440;
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.4);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } catch(e) {}
  }

  soundBtn.addEventListener('click', ()=>{
    soundOn = !soundOn;
    soundBtn.setAttribute('aria-pressed', soundOn);
    soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';
    try { localStorage.setItem('breathe-sound', soundOn ? '1' : '0'); } catch(e) {}
  });
  try { soundOn = localStorage.getItem('breathe-sound') === '1'; } catch(e) {}
  soundBtn.setAttribute('aria-pressed', soundOn);
  soundBtn.textContent = soundOn ? 'Sound on' : 'Sound off';

  function setPreset(str, save){
    pattern = str.split(',').map(Number);
    if (save !== false) { try { localStorage.setItem('breathe-preset', str); } catch(e) {} }
    if (running) runPhase(0);
  }

  presetButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      presetButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      setPreset(btn.dataset.pattern);
    });
  });

  document.getElementById('applyCustom').addEventListener('click', ()=>{
    const vals = ['cIn','cHold1','cOut','cHold2'].map(id=>Number(document.getElementById(id).value)||0);
    presetButtons.forEach(b=>b.classList.remove('active'));
    setPreset(vals.join(','));
  });

  // restore last-used preset
  try {
    const saved = localStorage.getItem('breathe-preset');
    if (saved){
      pattern = saved.split(',').map(Number);
      const match = [...presetButtons].find(b=>b.dataset.pattern === saved);
      if (match){ presetButtons.forEach(b=>b.classList.remove('active')); match.classList.add('active'); }
    }
  } catch(e) {}

  // Recursive setTimeout state machine: i counts forever (not mod 4) so a
  // full cycle back to phase 0 is detectable to bump the rep counter, and a
  // 0-second phase (custom pattern) recurses straight through without
  // scheduling a timer or playing a chime for it.
  function runPhase(i){
    clearTimeout(timer);
    if (i % 4 === 0 && i !== 0) { reps++; repCount.textContent = reps; }
    phaseIdx = i % 4;
    const dur = pattern[phaseIdx];
    if (dur === 0){ runPhase(phaseIdx+1); return; }
    label.textContent = phaseNames[phaseIdx];
    chime();
    circle.style.transitionDuration = dur + 's';
    circle.style.transform = `translate(-50%,-50%) scale(${phaseScale[phaseIdx]})`;
    timer = setTimeout(()=>runPhase(i+1), dur*1000);
  }

  function start(){
    if (running) return;
    running = true;
    toggleBtn.textContent = 'Stop';
    reps = 0; repCount.textContent = 0;
    runPhase(0);
  }
  function stop(){
    if (!running) return;
    running = false;
    toggleBtn.textContent = 'Start';
    clearTimeout(timer);
    circle.style.transitionDuration = '1s';
    circle.style.transform = 'translate(-50%,-50%) scale(1)';
    label.textContent = 'Breathe';
  }

  toggleBtn.addEventListener('click', ()=> running ? stop() : start());

  document.addEventListener('keydown', (e)=>{
    if (e.code === 'Space' && e.target === document.body){
      e.preventDefault();
      running ? stop() : start();
    }
  });

  // Scroll-triggered reveal for sections below the fold
  (function () {
    const els = document.querySelectorAll('.reveal');
    if (!els.length) return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold: 0.1 });
    els.forEach((el) => io.observe(el));
  })();

  // Subtle parallax on the ambient ring behind the breathing circle
  (function () {
    const ring = document.querySelector('.ring');
    if (!ring || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    let ticking = false;
    function apply() { ring.style.transform = 'translateY(' + (window.scrollY * 0.06) + 'px)'; ticking = false; }
    window.addEventListener('scroll', () => { if (!ticking) { requestAnimationFrame(apply); ticking = true; } }, { passive: true });
  })();
</script>

</body>
</html>
