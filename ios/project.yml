name: Windgate
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "202610031700"
targets:
  Windgate:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.breathe
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Windgate.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Windgate-macOS.entitlements
  WindgateTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tests
    dependencies:
      - target: Windgate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.breathe.tests
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/Windgate.app/Contents/MacOS/Windgate
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: QMM486NPYC
schemes:
  Windgate:
    build:
      targets:
        Windgate: all
        WindgateTests: [test]
    test:
      targets:
        - WindgateTests
    run:
      config: Debug
    archive:
      config: Release
    shared: true
